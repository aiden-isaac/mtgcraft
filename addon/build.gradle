plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.21'
}

version = '0.1.0'
group = 'mtgcraft'
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.160.5+26.3'
    implementation files('../.cache/upstream/mtgcard/fabric/build/libs/MtgCard-fabric-1.7.0-26.3.jar')
}
sourceSets.main.java.srcDirs += ['../shared/src/main/java']
sourceSets {
    probe {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        compileClasspath += files('../.cache/project/mtgcraft-service.jar')
        runtimeClasspath += files('../.cache/project/mtgcraft-service.jar')
    }
}
loom {
    mods {
        mtgcraft { sourceSet sourceSets.main }
        mtgcraft_probe { sourceSet sourceSets.probe }
    }
    runs {
        custodyProbe {
            server()
            source sourceSets.probe
            runDir System.getProperty('custody.runDir', '../.cache/custody-probe')
            vmArg '-ea'
        }
    }
}
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
tasks.test { failOnNoDiscoveredTests = false }
tasks.register('adapterCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'mtgcraft.minecraft.mtgcard.AdapterCheck'
    enableAssertions = true
}
tasks.check { dependsOn adapterCheck }
tasks.processResources {
    inputs.file('../service/catalog/manifest.json')
    doLast {
        def bytes = file('../service/catalog/manifest.json').bytes
        def manifest = new groovy.json.JsonSlurper().parse(bytes)
        def compatibility = [protocolVersion: 1, format: manifest.format, formatVersion: manifest.formatVersion,
                mappingDigest: java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString(),
                engineBuild: manifest.engineBuild, catalogDigest: manifest.catalogDigest]
        def target = new File(destinationDir, 'mtgcraft-compatibility.json')
        target.text = groovy.json.JsonOutput.toJson(compatibility)
    }
}
